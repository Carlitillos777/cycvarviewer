# Publishes the browser viewer (viz/) to GitHub Pages on every push to main.
# The viewer is served from the site root; its item sets are copied to data/sets/ beside it.
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        # the viewer sits at the site root (no /viz in the URL), with the item sets next to it in data/sets/
        run: |
          mkdir -p _site/data
          cp -r viz/. _site/
          cp -r data/sets _site/data/sets
          sed -i "s#'../data/sets/'#'data/sets/'#" _site/index.html
          grep -q "'data/sets/'" _site/index.html
          # old links and browsers that cached the earlier redirect to viz/ land back on the viewer
          mkdir -p _site/viz
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../?from=viz"><title>Cycvar Viewer</title><a href="../">Cycvar Viewer</a>' > _site/viz/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
