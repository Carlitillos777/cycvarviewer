# Publishes the browser viewer (viz/) to GitHub Pages on every push to main.
# The site keeps the repo layout the viewer expects (viz/ next to data/sets/), and the site root redirects to viz/.
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r viz _site/viz
          cp -r data/sets _site/data/sets
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=viz/"><title>Cycvar Viewer</title><a href="viz/">Cycvar Viewer</a>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
